<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="#0B132B" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#blueGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Robot Head / Chip -->
  <rect x="18" y="20" width="28" height="24" rx="6" fill="#1C2541" stroke="#00F0FF" stroke-width="2" />
  <!-- Antenna -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="11" r="3" fill="#00F0FF" filter="url(#glow)" />
  <!-- Robot Eyes -->
  <circle cx="26" cy="30" r="3.5" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="38" cy="30" r="3.5" fill="#00F0FF" filter="url(#glow)" />
  <!-- Robot Mouth / Circuit line -->
  <path d="M25 38H39" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <path d="M29 38V41M35 38V41" stroke="#3B82F6" stroke-width="1.5" />
  <!-- Ears / Sensors -->
  <rect x="14" y="28" width="4" height="8" rx="2" fill="#00F0FF" />
  <rect x="46" y="28" width="4" height="8" rx="2" fill="#00F0FF" />
</svg>
